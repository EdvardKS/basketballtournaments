# Production stack. Same host ports as dev (4322 / 4010 / 5434) but
# runs compiled/built images, no source-code volume mounts, no HMR.
#
# Usage:
#   cp db/.env.prod.example db/.env.prod           (edit secrets)
#   cp backend/.env.prod.example backend/.env.prod (edit secrets)
#   cp frontend/.env.prod.example frontend/.env.prod
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile.prod
    container_name: basket_db_prod
    restart: unless-stopped
    env_file: ./db/.env.prod
    volumes:
      - basket_pgdata_prod:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    networks:
      - basket_net_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: basket_backend_prod
    restart: unless-stopped
    env_file: ./backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4010:4000"
    networks:
      - basket_net_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: basket_frontend_prod
    restart: unless-stopped
    env_file: ./frontend/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4322:4321"
    networks:
      - basket_net_prod

networks:
  basket_net_prod:
    driver: bridge

volumes:
  basket_pgdata_prod:
