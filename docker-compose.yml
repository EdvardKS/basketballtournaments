# Production stack (default). Builds compiled images, no source mounts, no HMR.
# Same host ports as dev (4322 / 4010 / 5434).
#
# Usage:
#   cp db/.env.prod.example db/.env.prod           (edit secrets)
#   cp backend/.env.prod.example backend/.env.prod (edit secrets)
#   cp frontend/.env.prod.example frontend/.env.prod
#   docker compose up -d --build
#
# For development (HMR, source mounts): use docker-compose.dev.yml.

services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile.prod
    container_name: basket_db_prod
    restart: unless-stopped
    env_file: ./db/.env.prod
    volumes:
      - basket_pgdata_prod:/var/lib/postgresql/data
      # Schema + seed SQL are applied by the backend on boot (see
      # backend/src/db/migrate.ts). No docker-entrypoint-initdb.d mount:
      # that path only runs on *first* DB init, which breaks upgrades.
    networks:
      - basket_net_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: basket_backend_prod
    restart: unless-stopped
    env_file: ./backend/.env.prod
    environment:
      # SMTP relay (shared mail_net). No auth; From must be *@mail.iaeks.com.
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_FROM: ${SMTP_FROM:-basket@mail.iaeks.com}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://basket.edvardks.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/init:/app/migrations:ro
      - ./db/seeds:/app/seeds:ro
      - ./backend/data:/app/data
    networks:
      - basket_net_prod
      - mail_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: basket_frontend_prod
    restart: unless-stopped
    env_file: ./frontend/.env.prod
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - basket_net_prod
      - reverse_proxy

networks:
  basket_net_prod:
    driver: bridge
  reverse_proxy:
    external: true
  # Shared SMTP relay network (host "smtp"). Created once: docker network create mail_net
  mail_net:
    external: true

volumes:
  basket_pgdata_prod:
